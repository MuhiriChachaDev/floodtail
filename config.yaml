# =============================================================================
# FLOODTAIL Configuration
# =============================================================================
#
# IMPORTANT NOTICE:
# These are PROTOTYPE configuration values for development and testing.
# They are NOT:
#   - Kenya Re internal assumptions
#   - Production pricing rules
#   - Scientifically validated Kenya-specific parameters
#   - Regulatory-approved values
#
# All values will be calibrated during later phases with domain expertise.
# =============================================================================

project:
  name: "FLOODTAIL"
  version: "0.1.0"
  environment: "development"

simulation:
  years: 10000
  seed: 482913

risk:
  tail_confidence: 0.996

pricing:
  cost_of_capital_rate: 0.10
  expense_rate: 0.10

model:
  hazard_version: "prototype"
  vulnerability_version: "prototype"
  model_version: "0.1.0"

governance:
  require_human_decision: true
  audit_enabled: true

data:
  portfolio_required_fields:
    - policy_id
    - latitude
    - longitude
    - insured_value
    - property_type

catastrophe:
  event_catalogue_path: "data/demo/events.csv"
  footprints_path: "data/demo/footprints.json"
  default_frequency: 1.0
  simulation_years: 10000
  seed: 482913
  coordinate_reference_system: "EPSG:4326"

vulnerability:
  interpolation: "linear"
  default_curve: "prototype"
  curve_path: "data/demo/vulnerability_curves.csv"

storage:
  event_output_path: "data/processed"
  hazard_output_path: "data/processed"
  elt_output_path: "data/processed"
  ylt_output_path: "data/processed"

