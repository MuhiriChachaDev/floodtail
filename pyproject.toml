[project]
name = "floodtail"
version = "0.1.0"
description = "Nairobi urban pluvial flood CAT model for reinsurance — ML + agentic AI + deterministic EP core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "shapely>=2.0"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "shap>=0.45", "joblib>=1.4"]
llm = ["langchain-ollama>=0.1", "langchain-core>=0.2", "langgraph>=0.1"]
rag = [
    "pypdf>=4.2",
    "python-docx>=1.1",
    "olefile>=0.47",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
security = ["python-jose[cryptography]>=3.3", "cryptography>=42", "passlib[bcrypt]>=1.7"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]
all = ["floodtail[geo,ml,llm,rag,security,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
