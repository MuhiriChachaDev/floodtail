# Use this on first Contabo boot before TLS certs exist.
# docker compose: mount this file instead of floodtail.conf until Certbot is done.
#
#   volumes:
#     - ./infra/nginx/floodtail.http-only.conf:/etc/nginx/conf.d/default.conf:ro

upstream floodtail_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 55m;

    location / {
        proxy_pass http://floodtail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
