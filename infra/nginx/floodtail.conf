# FLOODTAIL reverse proxy — Contabo VPS
# HTTP bootstrap + HTTPS when /etc/nginx/certs/{fullchain,privkey}.pem exist.
# See DEPLOYMENT.md for Certbot steps.

upstream floodtail_api {
    server api:8000;
    keepalive 16;
}

# ACME / Let's Encrypt HTTP-01
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS once certs are in place; until then proxy plain HTTP.
    # After Certbot: uncomment the return and comment out the proxy block below.
    # return 301 https://$host$request_uri;

    client_max_body_size 55m;

    location / {
        proxy_pass http://floodtail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Long CAT runs / training can exceed 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# TLS — enable after placing certs in infra/nginx/certs/
# fullchain.pem + privkey.pem (or symlink from certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Fail closed if certs missing — comment this whole server{} until Certbot succeeds
    # so nginx still starts on HTTP-only first boot. See floodtail.http-only.conf.

    client_max_body_size 55m;

    location / {
        proxy_pass http://floodtail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
